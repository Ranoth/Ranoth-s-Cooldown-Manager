name: Package and Release

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set packaged addon versions
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          version = os.environ["RELEASE_TAG"]
          files = [
              Path("Ranoth-s-Cooldown-Manager.toc"),
              Path("Ranoth-s-Cooldown-Manager_Options")
              / "Ranoth-s-Cooldown-Manager_Options.toc",
          ]
          for path in files:
              lines = path.read_text().splitlines()
              if sum(line.startswith("## Version:") for line in lines) != 1:
                  raise SystemExit(f"Expected one version entry in {path}")
              path.write_text("\n".join(
                  f"## Version: {version}"
                  if line.startswith("## Version:") else line
                  for line in lines
              ) + "\n")
          PY

      - name: Prepare generated release notes
        env:
          RELEASE_BODY: ${{ github.event.release.body }}
        run: printf '%s\n' "$RELEASE_BODY" > RELEASE.md

      - name: Package and upload
        uses: BigWigsMods/packager@master
        env:
          GITHUB_OAUTH: ${{ secrets.PAT }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
